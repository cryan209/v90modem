! Default calling numbers for empty ANI only; preserve terminal-supplied numbers.
! Cisco voice translation-profile: incoming applies to calls arriving on the BRI.
voice translation-rule 2600
 rule 1 /^$/ /2600/
!
voice translation-profile CID2600
 translate calling 2600
!
voice-port 0/1/0
 translation-profile incoming CID2600
!
voice translation-rule 2610
 rule 1 /^$/ /2610/
!
voice translation-profile CID2610
 translate calling 2610
!
voice-port 0/1/1
 translation-profile incoming CID2610
!
voice translation-rule 2620
 rule 1 /^$/ /2620/
!
voice translation-profile CID2620
 translate calling 2620
!
voice-port 0/2/0
 translation-profile incoming CID2620
!
voice translation-rule 2630
 rule 1 /^$/ /2630/
!
voice translation-profile CID2630
 translate calling 2630
!
voice-port 0/2/1
 translation-profile incoming CID2630
!
